license="MIT"

[[mods]]
modId="schematica"
version="${mod_version}"
displayName="${mod_name}"
description='''
Import schematics, export schematics, build schematics. All inside Minecraft!
Modern NeoForge 26.3 port of the original Schematica by Lunatrius.
'''

[[dependencies.schematica]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.schematica]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.schematica]]
    modId="lunatriuscore"
    type="required"
    versionRange="[2.0.0,)"
    ordering="BEFORE"
    side="BOTH"
